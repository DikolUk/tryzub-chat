name: varta
description: "VARTA — Захищений месенджер для закритих спільнот"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  http: ^1.2.2
  shared_preferences: ^2.3.3
  intl: ^0.20.3
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  record: ^5.2.1
  audioplayers: ^6.0.0
  path_provider: ^2.1.4
  cryptography: ^2.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

dependency_overrides:
  record_linux: '>=1.2.0 <2.0.0'
  record_platform_interface: '>=1.4.0 <2.0.0'

flutter:
  uses-material-design: true
  assets:
    - assets/images/
